<title>Nostalgic TV — Program Guide</title>
<style>
  :root {
    --paper:      #e7e8e3;
    --paper-2:    #dddfd8;
    --ink:        #191b17;
    --ink-soft:   #5f635a;
    --ink-faint:  #8a8e84;
    --rule:       #c4c7bd;
    --rule-soft:  #d3d6cc;
    --now:        #1d6f36;
    --now-bg:     #cfe3d3;

    --display: 'Haettenschweiler', 'Arial Narrow', 'Helvetica Neue Condensed', 'Liberation Sans Narrow', Impact, sans-serif;
    --body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:     #131511;
      --paper-2:   #1c1f19;
      --ink:       #e4e6dd;
      --ink-soft:  #9aa093;
      --ink-faint: #6b7165;
      --rule:      #33372e;
      --rule-soft: #26291f;
      --now:       #6ee08f;
      --now-bg:    #1b3323;
    }
  }
  :root[data-theme="dark"] {
    --paper:     #131511;
    --paper-2:   #1c1f19;
    --ink:       #e4e6dd;
    --ink-soft:  #9aa093;
    --ink-faint: #6b7165;
    --rule:      #33372e;
    --rule-soft: #26291f;
    --now:       #6ee08f;
    --now-bg:    #1b3323;
  }
  :root[data-theme="light"] {
    --paper:     #e7e8e3;
    --paper-2:   #dddfd8;
    --ink:       #191b17;
    --ink-soft:  #5f635a;
    --ink-faint: #8a8e84;
    --rule:      #c4c7bd;
    --rule-soft: #d3d6cc;
    --now:       #1d6f36;
    --now-bg:    #cfe3d3;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 72px; }

  /* ── Masthead ─────────────────────────────────────────── */
  .masthead {
    position: sticky; top: 0; z-index: 20;
    background: var(--paper);
    border-bottom: 2px solid var(--ink);
    padding: 14px 0 10px;
  }
  .masthead-inner {
    max-width: 1100px; margin: 0 auto; padding: 0 20px;
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
  }
  .title-block { display: flex; flex-direction: column; gap: 1px; }
  h1 {
    font-family: var(--display);
    font-size: clamp(30px, 6vw, 52px);
    font-weight: 400;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0; line-height: 0.9;
    text-wrap: balance;
  }
  .kicker {
    font-family: var(--mono);
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .daynav { display: flex; align-items: center; gap: 8px; padding-bottom: 3px; }
  .daynav button {
    font-family: var(--mono); font-size: 15px; line-height: 1;
    background: transparent; color: var(--ink);
    border: 1px solid var(--rule); border-radius: 2px;
    width: 30px; height: 30px; cursor: pointer;
  }
  .daynav button:hover { background: var(--paper-2); }
  .daynav button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .daynav button[disabled] { opacity: 0.3; cursor: default; }
  #dayLabel {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em;
    text-transform: uppercase; min-width: 190px; text-align: center;
    font-variant-numeric: tabular-nums;
  }

  /* ── Channel jump rail ────────────────────────────────── */
  .rail {
    display: flex; gap: 5px; overflow-x: auto; padding: 9px 0 2px;
    scrollbar-width: thin;
  }
  .rail a {
    flex: 0 0 auto;
    font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums;
    text-decoration: none; color: var(--ink);
    border: 1px solid var(--rule); border-left-width: 4px;
    padding: 3px 8px; border-radius: 2px; white-space: nowrap;
  }
  .rail a:hover { background: var(--paper-2); }
  .rail a:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }

  .legend {
    display: flex; gap: 18px; flex-wrap: wrap;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-faint);
    padding: 14px 0 0; margin-top: 16px; border-top: 1px solid var(--rule-soft);
  }
  .legend b { color: var(--now); font-weight: 700; }

  /* ── Channel section ──────────────────────────────────── */
  .channel { margin-top: 40px; scroll-margin-top: 128px; }
  .ch-head {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 6px;
  }
  .ch-num {
    font-family: var(--display); font-size: 34px; line-height: 0.85;
    font-variant-numeric: tabular-nums;
  }
  .ch-name {
    font-family: var(--display); font-size: 25px; line-height: 1;
    text-transform: uppercase; letter-spacing: 0.02em;
  }
  .ch-era {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
    color: var(--ink-faint); margin-left: auto;
  }
  .ch-desc {
    font-size: 13px; color: var(--ink-soft); margin: 7px 0 0;
    max-width: 62ch;
  }

  .daypart {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--ink-faint);
    margin: 20px 0 5px; padding-bottom: 3px;
    border-bottom: 1px dashed var(--rule);
  }

  ol.listings { list-style: none; margin: 0; padding: 0; }
  .prog {
    display: grid;
    grid-template-columns: 62px 1fr auto;
    gap: 0 14px; align-items: baseline;
    padding: 5px 6px 5px 0;
    border-bottom: 1px solid var(--rule-soft);
  }
  .prog:last-child { border-bottom: none; }
  .prog-time {
    font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums;
    color: var(--ink-soft); letter-spacing: 0.02em;
  }
  .prog-title { font-weight: 600; text-wrap: pretty; }
  .prog-show { font-size: 12.5px; color: var(--ink-soft); }
  .prog-dur {
    font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums;
    color: var(--ink-faint); white-space: nowrap;
  }

  .cont {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-faint); font-weight: 400;
    margin-left: 8px; white-space: nowrap;
  }

  .prog.is-ad { padding-top: 3px; padding-bottom: 3px; }
  .prog.is-ad .prog-title { font-weight: 400; font-size: 12.5px; color: var(--ink-faint); font-style: italic; }
  .prog.is-ad .prog-time { color: var(--ink-faint); }

  .prog.is-now { background: var(--now-bg); box-shadow: -6px 0 0 var(--now-bg), 6px 0 0 var(--now-bg); }
  .prog.is-now .prog-time, .prog.is-now .prog-title { color: var(--now); }
  .prog.is-now .prog-title::after {
    content: ' ON NOW';
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.16em;
    color: var(--now); font-weight: 700;
  }

  .prog.is-offair { grid-template-columns: 62px 1fr; }
  .prog.is-offair .prog-title { font-weight: 400; color: var(--ink-faint); font-style: italic; }

  footer {
    margin-top: 56px; padding-top: 14px; border-top: 2px solid var(--ink);
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em;
    color: var(--ink-faint); text-transform: uppercase;
  }

  @media (max-width: 620px) {
    .prog { grid-template-columns: 54px 1fr; }
    .prog-dur { grid-column: 2; font-size: 10.5px; }
    .ch-era { margin-left: 0; flex-basis: 100%; }
    #dayLabel { min-width: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>

</header>

</div>

/* Same scheduling maths the TV itself runs: playlists are anchored to the
   Unix epoch, so every listing below is exactly what will be on screen. */
function daypartForDate(d) {
  const h = d.getHours();
  if (h >= 6 && h < 12) return d.getDay() === 6 ? 'satAM' : 'morning';
  if (h >= 12 && h < 19) return 'arvo';
  if (h >= 19 && h < 22) return 'evening';
  if (h >= 22) return 'afterdark';
  return 'late';
}
function playlistForDaypart(ch, dp) {
  if (dp === 'satAM')    return ch.blocks.satAM    || ch.blocks.morning || null;
  if (dp === 'afterdark') return ch.blocks.afterdark || ch.blocks.evening || null;
  // A station already open at 10pm keeps the same lineup past midnight.
  if (dp === 'late')     return ch.blocks.late     || ch.blocks.afterdark || null;
  return ch.blocks[dp] || null;
}
const DAYPART_LABEL = {
  satAM: 'Saturday Morning', morning: 'Morning', arvo: 'Afternoon',
  evening: 'Evening', afterdark: 'After Dark', late: 'Late Night'
};

// ── Block anchoring: identical to the TV's own scheduler ─────────────────
const DAYPART_HOURS = [6, 12, 19, 22];

function daypartStart(d) {
  let b = 0;
  for (const h of DAYPART_HOURS) if (d.getHours() >= h) b = h;
  const s = new Date(d); s.setHours(b, 0, 0, 0);
  return s;
}
function nextDaypartBoundary(d) {
  const y = d.getFullYear(), mo = d.getMonth(), da = d.getDate(), h = d.getHours();
  for (const b of DAYPART_HOURS) if (b > h) return new Date(y, mo, da, b, 0, 0, 0);
  return new Date(y, mo, da + 1, 0, 0, 0, 0);
}
function blockRange(ch, d) {
  const playlist = playlistForDaypart(ch, daypartForDate(d));
  let start = daypartStart(d);
  for (let i = 0; i < 8; i++) {
    const before = new Date(start.getTime() - 1000);
    if (playlistForDaypart(ch, daypartForDate(before)) !== playlist) break;
    start = daypartStart(before);
  }
  let end = nextDaypartBoundary(d);
  for (let i = 0; i < 8; i++) {
    if (playlistForDaypart(ch, daypartForDate(end)) !== playlist) break;
    end = nextDaypartBoundary(end);
  }
  return { playlist, start, end };
}
function rotatedPlaylist(playlist, blockStartSec) {
  if (!playlist || playlist.length < 2) return playlist;
  const day = Math.floor(blockStartSec / 86400);
  const k = ((day % playlist.length) + playlist.length) % playlist.length;
  return playlist.slice(k).concat(playlist.slice(0, k));
}

function dayFor(ch, startDate, endDate) {
  const nowSec = Math.floor(Date.now() / 1000);
  const fromSec = Math.floor(startDate.getTime() / 1000);
  const toSec   = Math.floor(endDate.getTime() / 1000);
  const segs = [];
  let cursor = new Date(startDate);

  for (let guard = 0; cursor < endDate && guard < 24; guard++) {
    const { playlist, start, end } = blockRange(ch, cursor);
    const startSec = Math.floor(start.getTime() / 1000);
    const endSec   = Math.floor(end.getTime() / 1000);
    const dp = daypartForDate(cursor);

    if (!playlist || !playlist.length) {
      segs.push({ dp, offAir: true, start: Math.max(startSec, fromSec), end: Math.min(endSec, toSec) });
    } else {
      const list = rotatedPlaylist(playlist, startSec);
      const rows = [];
      let t = startSec;
      for (let n = 0; t < endSec && n < 400; n++) {
        const ep = list[n % list.length];
        const s = t, e = s + ep.d * 60;
        if (e > fromSec && s < Math.min(endSec, toSec)) {
          rows.push({ ep, start: s, end: Math.min(e, endSec),
                      now: s <= nowSec && e > nowSec && nowSec >= startSec && nowSec < endSec });
        }
        t = e;
      }
      segs.push({ dp, segStart: Math.max(startSec, fromSec), rows });
    }
    cursor = end;
  }
  return segs;
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const hhmm = sec => new Date(sec * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
const mins = m => (m >= 60 ? Math.floor(m / 60) + 'h ' + String(Math.round(m % 60)).padStart(2, '0') + 'm' : Math.round(m) + 'm');

let dayOffset = 0;

function nextOnAir(ch, fromDate) {
  const probe = new Date(fromDate);
  for (let i = 0; i < 12; i++) {
    const pl = playlistForDaypart(ch, daypartForDate(probe));
    if (pl && pl.length) return probe;
    const nh = [6, 12, 19, 22].find(b => b > probe.getHours());
    if (nh === undefined) probe.setHours(24, 0, 0, 0); else probe.setHours(nh, 0, 0, 0);
  }
  return null;
}

function render() {
  // The broadcast day runs 6am to 6am, so before 6am you are still inside
  // yesterday's day — anchor to that, or the small hours list as "tomorrow".
  const start = new Date();
  if (start.getHours() < 6) start.setDate(start.getDate() - 1);
  start.setHours(6, 0, 0, 0);
  start.setDate(start.getDate() + dayOffset);
  const end = new Date(start); end.setDate(end.getDate() + 1);

  document.getElementById('dayLabel').textContent =
    start.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' });
  document.getElementById('prevDay').disabled = dayOffset <= -1;
  document.getElementById('nextDay').disabled = dayOffset >= 6;

  document.getElementById('rail').innerHTML = CHANNELS.map(c =>
    `<a href="#ch${c.n}" style="border-left-color:${c.color}">${c.n} ${esc(c.name)}</a>`).join('');

  document.getElementById('guide').innerHTML = CHANNELS.map(ch => {
    const segs = dayFor(ch, start, end);
    let lastLabel = null;
    const body = segs.map(seg => {
      let out = '';
      const label = DAYPART_LABEL[seg.dp];
      if (label !== lastLabel) { out += `<div class="daypart">${label}</div>`; lastLabel = label; }
      if (seg.offAir) {
        const back = nextOnAir(ch, new Date(seg.end * 1000));
        const when = back ? back.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : null;
        return out + `<ol class="listings"><li class="prog is-offair">
          <span class="prog-time">${hhmm(seg.start)}</span>
          <span class="prog-title">Off air${when ? ' &mdash; back at ' + when : ''}</span></li></ol>`;
      }
      return out + '<ol class="listings">' + seg.rows.map(r => {
        // A programme straddling a daypart boundary is joined in progress —
        // list it at the time it actually appears, with the time left to run.
        const joined = r.start < seg.segStart;
        const shownAt = joined ? seg.segStart : r.start;
        const left = (r.end - shownAt) / 60;
        return `
        <li class="prog${r.ep.ad ? ' is-ad' : ''}${r.now ? ' is-now' : ''}">
          <span class="prog-time">${hhmm(shownAt)}</span>
          <span class="prog-title">${esc(r.ep.t)}${joined ? '<span class="cont">joined in progress</span>' : ''}</span>
          <span class="prog-dur">${mins(left)}</span>
          ${r.ep.ad ? '' : `<span></span><span class="prog-show">${esc(r.ep.s)}${r.ep.y ? ' &middot; ' + r.ep.y : ''}</span>`}
        </li>`;
      }).join('') + '</ol>';
    }).join('');

    return `<section class="channel" id="ch${ch.n}">
      <div class="ch-head" style="border-bottom-color:${ch.color}">
        <span class="ch-num" style="color:${ch.color}">${ch.n}</span>
        <span class="ch-name">${esc(ch.name)}</span>
        <span class="ch-era">${esc(ch.era)}</span>
      </div>
      <p class="ch-desc">${esc(ch.desc)}</p>
      ${body}
    </section>`;
  }).join('');

  const totalProgs = CHANNELS.reduce((s, c) =>
    s + Object.values(c.blocks).reduce((t, b) => t + (b ? b.length : 0), 0), 0);
  document.getElementById('foot').textContent =
    `${CHANNELS.length} channels · ${totalProgs} programmes in rotation · times are your local clock · generated ${new Date().toLocaleString()}`;
}

document.getElementById('prevDay').addEventListener('click', () => { dayOffset--; render(); scrollTo({ top: 0 }); });
document.getElementById('nextDay').addEventListener('click', () => { dayOffset++; render(); scrollTo({ top: 0 }); });
render();
setInterval(render, 60000);
</script>
